volumes:
  dedicated_postgres:

services:
  postgres:
    container_name: postgres_dedicated_container
    image: postgres:17
    environment:
      POSTGRES_USER: amir
      POSTGRES_PASSWORD: amir
      PGDATA: /data/postgres
    volumes:
       - dedicated_postgres:/data/dedicated_postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amir"]
      interval: 10s
      timeout: 5s
      retries: 10
